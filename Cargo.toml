[package]
name = "vmp_devirt"
version = "0.1.0"
edition = "2021"
authors = ["VMP Devirtualizer Team"]
description = "Generalized VMProtect devirtualizer (VMP 1.0-3.10.5)"
license = "MIT"

[[bin]]
name = "vmp_devirt"
path = "src/bin/cli.rs"

[lib]
name = "vmp_devirt"
path = "src/lib.rs"

[dependencies]
goblin = "0.10"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
byteorder = "1.5"
clap = { version = "4.6", features = ["derive"] }
log = "0.4.33"
env_logger = "0.11.11"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
